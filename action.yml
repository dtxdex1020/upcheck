name: upcheck
description: Check that URLs are up (status, response time, TLS expiry, keyword) and fail the job if not.
author: Dex
branding:
  icon: activity
  color: blue

inputs:
  urls:
    description: URLs to check, separated by spaces or newlines.
    required: false
  config:
    description: Path to a JSON or YAML config file.
    required: false
  args:
    description: Extra CLI flags, e.g. "--min-tls-days 21 --timeout 5000".
    required: false

runs:
  using: composite
  steps:
    - name: Install upcheck
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund --loglevel=error
    - name: Run upcheck
      shell: bash
      env:
        UPCHECK_URLS: ${{ inputs.urls }}
        UPCHECK_CONFIG: ${{ inputs.config }}
        UPCHECK_ARGS: ${{ inputs.args }}
      run: |
        set -f
        node "$GITHUB_ACTION_PATH/dist/cli.js" $UPCHECK_URLS ${UPCHECK_CONFIG:+--config "$UPCHECK_CONFIG"} $UPCHECK_ARGS
